services:
  catalog-service:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${SERVICE_IMAGE:-masterdoc-catalog-service:latest}
    restart: unless-stopped
    ports:
      - "${CATALOG_SERVICE_PORT:-8091}:8091"
    environment:
      PORT: "8091"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
