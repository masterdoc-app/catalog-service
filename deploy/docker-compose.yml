services:
  catalog-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catalog}
      POSTGRES_USER: ${POSTGRES_USER:-catalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catalog}
    volumes:
      - catalog_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catalog} -d ${POSTGRES_DB:-catalog}"]
      interval: 5s
      timeout: 5s
      retries: 12

  catalog-service:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${SERVICE_IMAGE:-masterdoc-catalog-service:latest}
    restart: unless-stopped
    ports:
      - "${CATALOG_SERVICE_PORT:-8091}:8091"
    environment:
      PORT: "8091"
      DATABASE_URL: jdbc:postgresql://catalog-postgres:5432/${POSTGRES_DB:-catalog}?user=${POSTGRES_USER:-catalog}&password=${POSTGRES_PASSWORD:-catalog}
    depends_on:
      catalog-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8091/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  catalog_pg:
